packages:
  - apps/*
  - packages/*
  - evals
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.32.0'
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - eslint@10.12.0
  - lucide-react@1.51.0
  - pg-boss@12.36.0
  - pino@10.4.0
  - turbo@2.11.7
  - '@electric-sql/pglite@0.5.10'

# pnpm 11+ runs a dependency's install script only when it is listed here
allowBuilds:
  esbuild: true
  '@scarf/scarf': false

# one copy of the ORM, the in-process Postgres and zod everywhere, so their types match across packages
overrides:
  drizzle-orm: 0.45.4
  '@electric-sql/pglite': 0.5.10
  zod: 4.6.7
  # security (Dependabot, 2026-11-17): only the vulnerable ranges are lifted, to the latest patch in the same line
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'hono@<4.13.16': 4.13.18
  '@hono/node-server@>=2.0.0 <2.1.6': 2.1.8
