packages:
  - apps/*
  - packages/*
  - evals
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.32.0'
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - eslint@10.12.0
  - lucide-react@1.51.0
  - pg-boss@12.36.0
  - pino@10.4.0
  - turbo@2.11.7

# pnpm 11+ runs a dependency's install script only when it is listed here
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
