id: demo-refill
title: A refill request goes to the care team
caller_number: "+17205550116"
turns:
  - caller: Hello, Priscilla Moreau, June 25th 1957. I need a refill of my atorvastatin.
    reply: "Thanks, Priscilla. I've sent your atorvastatin request to the care team, with your pharmacy on file. They'll call you if they have questions."
