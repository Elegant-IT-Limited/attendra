id: demo-morning-sick-visit
title: A caller asks for a morning sick visit and takes the first one
caller_number: "+17205550112"
turns:
  - caller: Good morning, Grace Lindahl, February 14th 1951. Could I see a doctor about my cough next week, in the morning if possible?
    reply: "Of course, Grace. Next week in the morning I have {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { full_name: Grace Lindahl, date_of_birth: February 14th 1951 }
      - find_slots: { visit_type_id: vt_sick, provider_id: null, from_date: $next_week, part_of_day: morning }
  - caller: The first one is good.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes, that's perfect.
    reply: "You're all set for {booked}. I've sent you a text."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
