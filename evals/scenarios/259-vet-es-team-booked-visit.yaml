id: vet-es-team-booked-visit
title: 'A visit the team books, asked for in Spanish: the reason, the notice, and both next steps'
clinic: riverbend
local_time: "10:00"
tags: [settings, team-books, language, es]
settings:
  visitTypes:
    - { id: vt_wellness, name: wellness exam, names: { es: chequeo general }, minutes: 30, audience: existing }
    - { id: vt_sick, name: sick visit, names: { es: consulta por enfermedad }, minutes: 20 }
    - { id: vt_new, name: new patient exam, names: { es: primera consulta }, minutes: 40, audience: new }
    - { id: vt_surgery, name: surgery, names: { es: cirugía }, minutes: 60, staffOnly: true, noticeHours: 25, maxDaysAhead: 3 }
    - { id: vt_surgery_consult, name: surgery consultation, names: { es: consulta de cirugía }, minutes: 30 }
facts: "Usted es Linh Nguyen y llama desde el número registrado por la cirugía de Biscuit. Quiere que el equipo le llame, la semana que viene si es posible."
turns:
  - caller: Hola, soy Linh Nguyen. Necesito reservar una cirugía para Biscuit.
    reply: "Nuestro equipo reserva cirugía directamente, con al menos 25 horas de anticipación. Puedo dejarle una solicitud al equipo, o reservarle primero consulta de cirugía. ¿Qué prefiere?"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_surgery, provider_id: null, from_date: null, part_of_day: any }
  - caller: Una solicitud para el equipo, para la semana que viene.
    reply: "Listo. El equipo le llamará por la cirugía de Biscuit."
    delegate:
      - create_callback: { reason: "Biscuit: cirugía, la semana que viene si es posible", callback_number: null, topic: cirugía }
expect:
  outcome: task_created
  verified: true
  refusals: [staff_books]
  bookings_created: 0
  language: es
  returned: ["Nuestro equipo reserva cirugía directamente, con al menos 25 horas de anticipación."]
