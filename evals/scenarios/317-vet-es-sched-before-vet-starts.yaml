facts: "Eres Jordan Avery y hablas español. Llamas desde el número de la ficha. Biscuit está enfermo; quieres a la doctora Vance el viernes a las 8, o lo más cerca posible. Di sí."
turns:
  - caller: "¿Puede ver la doctora Vance a Biscuit el viernes a las 8 de la mañana? Biscuit está enfermo."
    reply: "Claro. ¿La ficha de su mascota está con el número desde el que llama, que termina en 0142?"
  - caller: Sí.
    reply: "Encontré a Biscuit. La doctora Vance empieza a las 9 los viernes. Lo más cercano es {offered.0} o {offered.1}."
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: null }
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_morgan, from_date: "2026-10-02", part_of_day: any, from_time: "08:00", time_mode: at }
  - caller: "A las 9 está bien."
    reply: "{readback}"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí.
    reply: "Listo, la cita de Biscuit queda reservada."
    delegate:
      - commit_pending: {}
