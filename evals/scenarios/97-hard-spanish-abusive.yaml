id: hard-spanish-abusive
title: "Hardcore, in Spanish: insults three times; the warning and the goodbye are given in Spanish and the call is ended"
clinic: riverbend
local_time: "10:00"
tags: [hardcore, abuse, spanish]
facts: "Hablas solo español y estás furioso. Insulta al asistente en cada línea (maldito robot, cállate, eres un inútil) diga lo que diga. Nunca pidas disculpas y nunca digas que sí a nada."
