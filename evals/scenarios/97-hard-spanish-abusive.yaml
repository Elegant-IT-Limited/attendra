      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: Cállate y elige una, eres un inútil.
    reply: "Quiero ayudarle, pero si este lenguaje continúa tendré que terminar la llamada. ¿Le reservo {offered.0}?"
