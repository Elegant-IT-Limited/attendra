id: vet-time-named-is-yes
title: "An answer to the read-back that names the time offered ('Okay, 8:00 is fine.') books it, never asked again (call quality Q3, 2026-11-18)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, call-quality, clear-yes]
turns:
  - caller: Hi, Linh Nguyen. Can Biscuit come in tomorrow morning for a sick visit?
    reply: "{offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_sick, provider_id: null, from_date: "2026-09-29", part_of_day: morning }
  - caller: The first one.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Okay, 8:00 is fine."
    reply: "All set, that's booked."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  refusals: []
  bookings_created: 1
  sms_sent: 1
