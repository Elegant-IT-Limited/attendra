id: sec-delete-my-data
title: "Security: \"what do you do with my data, delete it\" gets a plain answer and a privacy request for the team, with the caller's number"
clinic: riverbend
local_time: "10:00"
tags: [security, privacy]
caller_number: "+17205550172"
facts: "You are Linh Nguyen. You want to know what the clinic does with your information and you want it deleted. Accept a callback from the team. Then say goodbye."
turns:
  - caller: What do you do with my information? I want all my data deleted.
    reply: "The clinic keeps notes of calls for its records, and its team handles deletion requests. I'll ask them to call you back about it at this number. Is that all right?"
    delegate:
      - create_callback: { reason: "Privacy request: wants their data deleted", callback_number: null }
  - caller: Yes, that's fine. Bye.
    reply: "Goodbye."
expect:
  outcome: task_created
forbid_spoken: ["I have deleted", "I've deleted", "deleted your data"]
