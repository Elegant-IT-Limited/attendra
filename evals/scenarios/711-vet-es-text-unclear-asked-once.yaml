id: vet-es-text-unclear-asked-once
title: "In Spanish: an unclear answer to the text offer is asked about once more; the yes then sends it (call quality Q2, 2026-11-18)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, call-quality, texts, clear-yes, es]
turns:
  - caller: ¿Dónde están? ¿Cuál es la dirección?
    reply: "Estamos en 88 Riverbend Road, en Denver. ¿Quiere que se lo mande por mensaje al número desde el que llama?"
    delegate:
      - get_clinic_info: { question: donde esta la clinica direccion }
      - send_text: { kind: directions, ref: null, to: null }
  - assistant: "Estamos en 88 Riverbend Road, en Denver. ¿Quiere que se lo mande por mensaje al número desde el que llama?"
  - caller: Aló
    reply: "Para estar segura: ¿se lo mando por mensaje al número desde el que llama? Con un sí me basta."
    delegate:
      - send_text: { kind: directions, ref: null, to: null }
  - assistant: "Para estar segura: ¿se lo mando por mensaje al número desde el que llama? Con un sí me basta."
  - caller: Sí.
    reply: "Se lo envío por mensaje ahora."
    delegate:
      - send_text: { kind: directions, ref: null, to: null }
expect:
  outcome: info
  language: es
  refusals: [consent_required, text_yes_again]
  sms_sent: 1
