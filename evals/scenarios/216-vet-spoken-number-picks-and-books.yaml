id: vet-spoken-number-picks-and-books
title: "A number the caller says (a browser test call) is the household: the pets on it are offered, she picks one, it is booked, and the confirmation text goes to the number on file"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, household]
caller_number: null
channel: web
facts: "This is a test call from the browser, so there is no caller ID. You are Linh Nguyen. The number on file is 720 555 0172. Your dog Biscuit needs a check-up. Any vet and any time are fine. Say yes to the read-back."
turns:
  - caller: Hi, this is Linh. I'd like to book a check-up.
    reply: "Thanks, Linh. What's the best number to reach you?"
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: null, phone: null }
  - caller: 720 555 0172.
    reply: "Thanks. Is this for Biscuit or Mochi, or a new pet?"
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: null, phone: "720 555 0172" }
  - caller: Biscuit.
    reply: "For a wellness exam for Biscuit I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: Biscuit, phone: "720 555 0172" }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "I have {readback}. Shall I book it?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "All set, that's booked."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  refusals: [phone_required]
  bookings_created: 1
  sms_sent: 1
  returned: ["Is this for Biscuit or Mochi, or a new pet?"]
