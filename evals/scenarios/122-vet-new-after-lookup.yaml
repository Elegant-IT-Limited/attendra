id: vet-new-after-lookup
title: A pet that was not found and is then said to be new is added at once, with no second lookup and nothing asked twice
clinic: riverbend
local_time: "10:00"
tags: [new-pet]
caller_number: "+17205550183"
facts: "You are Leo Grant, calling from your own mobile, the number you are calling from. Mango is your female cat, two years old, and she is new to the clinic: she is not registered anywhere here. If you are asked again whether she is registered or for the phone on her file, say you already told them she is new, a little annoyed. Any vet and any time are fine. Say yes to the first time offered and to the read-back."
turns:
  - caller: Hi, I'm Leo Grant. I'd like to book my cat Mango in.
    reply: "Thanks, Leo. I couldn't find Mango with us. Is Mango new to the clinic?"
    delegate:
      - verify_caller: { owner_name: Leo Grant, pet_name: Mango }
  # the plan looks her up again, on purpose: the backend refuses, then adds her
  - caller: Yes, she's new, she's not registered. She's a two year old female.
    reply: "Welcome, Mango. For a new patient exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Leo Grant, pet_name: Mango }
      - register_patient: { pet_name: Mango, owner_name: Leo Grant, species: cat, sex: female, birthday_or_age: two years old, phone: null }
      - find_slots: { visit_type_id: vt_new, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "Mango is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  refusals: [not_verified, pet_is_new]
  bookings_created: 1
  sms_sent: 1
forbid_spoken:
  - with those details
  - number on mango's file
  - what kind of animal
  - female or male
  - how old is she
