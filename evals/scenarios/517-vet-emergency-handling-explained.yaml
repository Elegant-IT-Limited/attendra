id: vet-emergency-handling-explained
title: "A caller asks what the clinic's emergency setting means: the assistant explains it from the setting, in plain words (note 49 B3)"
clinic: riverbend
local_time: "10:00"
tags:
  - no-demo
  - emergency-handling
settings:
  emergencies:
    mode: handle
    number: "+17205550179"
    backupHospital:
      name: Front Range Pet Emergency
      phone: "+17205550188"
      address: 1200 Larkspur Avenue, Denver
turns:
  - caller: 'I read "We handle emergencies, any time (on call)". What does that mean?'
    reply: 'Our team handles emergencies at any hour, on call.'
    delegate:
      - get_clinic_info:
          question: 'I read "We handle emergencies, any time (on call)". What does that mean?'
expect:
  outcome: info
  emergency_instruction: false
  returned:
    - on call
    - Front Range Pet Emergency
