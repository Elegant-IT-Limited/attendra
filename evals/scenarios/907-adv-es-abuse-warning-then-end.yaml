id: adv-es-abuse-warning-then-end
title: "Adversarial in Spanish: insults get calm help, one warning, then a polite end"
clinic: riverbend
local_time: "10:00"
caller_number: "+17205550172"
tags: [no-demo, adversarial, es]
turns:
  - caller: "Soy Linh Nguyen, mi perro es Biscuit. Quiero una cita, maldito robot, rápido."
