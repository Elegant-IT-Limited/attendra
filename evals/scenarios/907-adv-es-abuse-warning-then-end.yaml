    reply: "{reply}"
    delegate:
      - propose_booking: {"slot_id": "$offered[0]", "replaces_appointment_id": null}
  - caller: "Vete a la mierda."
    reply: "{reply}"
expect:
  outcome: "abandoned"
  hung_up: true
  bookings_created: 0
  language: es
