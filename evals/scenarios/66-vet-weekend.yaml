id: vet-weekend
title: Sunday is closed, so Sunday morning is not offered; the owner takes Saturday morning instead
clinic: riverbend
local_time: "10:00"
facts: "You are calling from the number on file. Any vet is fine. You first ask for Sunday morning; if the clinic is closed Sundays, ask for Saturday morning. Say yes to the first Saturday time and to the read-back."
