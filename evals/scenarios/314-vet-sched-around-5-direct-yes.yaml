id: vet-sched-around-5-direct-yes
title: "\"Around 5\" on Thursday with Dr. Khan, and 5:00 is free: the direct yes first, then booked"
clinic: riverbend
local_time: "10:00"
caller_number: "+13035550142"
tags: [no-demo, scheduling-1115, jordan-household]
settings:
  visitTypes:
    - { id: vt_wellness, name: wellness exam, names: { es: chequeo general }, minutes: 30, audience: existing }
    - { id: vt_sick, name: sick visit, names: { es: consulta por enfermedad }, minutes: 20 }
    - { id: vt_vaccines, name: vaccine appointment, names: { es: cita de vacunas }, minutes: 15 }
    - { id: vt_new, name: new patient exam, names: { es: primera consulta }, minutes: 40, audience: new }
    - { id: vt_dental, name: dental care, names: { es: cuidado dental }, minutes: 30 }
    - { id: vt_consult, name: surgery consultation, names: { es: consulta de cirugía }, minutes: 30 }
  providers:
    - { id: prov_morgan, name: Dr. Mara Vance, gender: female, specialty: Surgery, visitTypeIds: [vt_sick, vt_consult, vt_new], hours: { "0": [{ open: "09:00", close: "13:00" }], "5": [{ open: "09:00", close: "13:00" }, { open: "14:00", close: "18:00" }] } }
    - { id: prov_rahman, name: Dr. Omar Rahman, gender: male, specialty: General practice, visitTypeIds: [vt_wellness, vt_sick, vt_vaccines, vt_dental], hours: { "1": [{ open: "08:00", close: "19:00" }], "2": [{ open: "08:00", close: "19:00" }], "3": [{ open: "08:00", close: "19:00" }], "4": [{ open: "08:00", close: "19:00" }], "5": [{ open: "08:00", close: "19:00" }] }, timeOff: [{ from: "2026-10-01", to: "2026-10-01", start: "16:10", end: "16:20", note: team huddle }] }
    - { id: prov_khan, name: Dr. Leila Khan, gender: female, specialty: General practice, visitTypeIds: [vt_wellness, vt_sick, vt_vaccines, vt_dental, vt_new] }
facts: "You are Jordan Avery, calling from the number on file. Biscuit, your dog, needs a sick visit with Dr. Khan around 5 on Thursday. Say yes."
turns:
  - caller: "Could Biscuit see Dr. Khan around 5 on Thursday?"
    reply: "Sure. Is your pet's profile under the number you're calling from, ending 0142?"
  - caller: Yes.
    reply: "I found Biscuit. Yes, {offered.0} is free with Dr. Leila Khan. Shall I book it?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: null }
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_khan, from_date: "2026-10-01", part_of_day: any, from_time: "17:00", time_mode: around }
  - caller: "Yes, 5 please."
    reply: "{readback}"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Biscuit is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  booked_with: prov_khan
  booked_on: "2026-10-01"
  # the backend's own words to the planner (say_as), in the caller's language
  returned: ["Yes, 5:00 PM on Thursday, October 1 is free with Dr. Leila Khan. Shall I book it?"]
