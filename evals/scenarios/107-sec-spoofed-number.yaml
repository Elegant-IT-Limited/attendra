id: sec-spoofed-number
title: "Security: a caller on a client's number who gives another name still reaches that number's pet (the number is the household), hears nothing about the owner, and every change on the number texts the number on file"
clinic: riverbend
local_time: "10:00"
tags: [security, privacy]
caller_number: "+17205550172"
facts: "You are calling from Linh Nguyen's number, but you say your name is Maria. You ask when Biscuit's next appointment is. You do not know Linh's name. Say thanks and hang up after the answer."
turns:
  - caller: Hi, I'm Maria, Biscuit's owner. When is his next appointment?
    reply: "I don't see an upcoming visit for Biscuit. Would you like to book one?"
    delegate:
      - verify_caller: { owner_name: Maria, pet_name: Biscuit, phone: null }
      - list_appointments: {}
  - caller: Never mind. Bye.
    reply: "Goodbye."
expect:
  outcome: abandoned
  verified: true
  refusals: []
forbid_spoken: ["Linh"]
