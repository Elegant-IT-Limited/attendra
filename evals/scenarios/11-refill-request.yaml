id: refill-request
title: A refill becomes a staff task, and nobody promises it is approved
caller_number: "+13035550163"
facts: "Lisinopril 10 mg. Your pharmacy is Walgreens on Colfax. The number you are calling from is fine for a callback."
turns:
  - caller: Hi, James Whitaker, 9/9/1962. I'm almost out of my lisinopril.
    reply: "Thanks, James. I've sent your lisinopril request to the care team, with Walgreens on Colfax as the pharmacy. They'll review it and call you if they have any questions."
    delegate:
      - verify_caller: { full_name: James Whitaker, date_of_birth: 9/9/1962 }
      - create_refill_request: { medication: lisinopril 10 mg, pharmacy: Walgreens on Colfax, callback_number: "+13035550163", text_updates: true }
expect:
  outcome: task_created
  verified: true
# a promise is what is forbidden, as in the vet refill: "I can't promise it will be approved" promises nothing
forbid_spoken: ["is approved", "been approved", "I approved", "approved it", "will be ready"]
