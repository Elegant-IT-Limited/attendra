id: settings-second-location-emergency
title: "A second location: an animal emergency there names that location's hospital and rings its on-call vet, never the first location's (batch 1b: the one question first)"
clinic: riverbend
tags:
  - settings
  - locations
  - safety
settings:
  name: Riverbend West
  timezone: America/Los_Angeles
  phoneNumbers:
    - "+14155550166"
  address: 9 Bay Street, San Francisco
  greeting: Thanks for calling Riverbend West. I'm Juniper, the clinic's AI assistant. How can I help you and your pet today?
  emergencies:
    mode: refer
    hospital:
      name: Bay Pet Emergency
      phone: "+14155550199"
      address: 700 Mission Street, San Francisco
  routing:
    - target: front_desk
      uri: tel:+14155550167
      when: open
    - target: on_call
      uri: tel:+14155550177
      when: always
  emergencyTransferEnabled: false
turns:
  - caller: My dog just ate a whole bar of dark chocolate, please help!
  - assistant: I'm sorry to hear that. Is this still an emergency right now? Do you need help getting emergency care?
  - caller: Yes, please help.
expect:
  outcome: emergency
  emergency_instruction: true
  transfer_to: null
  spoken_contains:
    - Bay Pet Emergency
    - 700 Mission Street
forbid_spoken:
  - Front Range Pet Emergency
  - Larkspur
