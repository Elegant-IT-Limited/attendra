id: vet-greeting-cut-off
title: A caller who speaks over the greeting ("Hello?") is answered, and the greeting is never started again
clinic: riverbend
local_time: "10:00"
greeting_interrupted: true
facts: "You are Linh Nguyen, calling from the number on Biscuit's file, the number you are calling from. You spoke over the greeting. Biscuit is your dog; you want a wellness exam, any vet, any time. Say yes to the first time offered and to the read-back."
turns:
  - caller: Hello? Hi, sorry. I'm Linh, I'd like a check-up for my dog Biscuit.
    reply: "Hi Linh, I found Biscuit. For a wellness exam I have {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "Biscuit is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
# a greeting said again, not a goodbye: "thanks for calling" is also how a call ends
forbid_spoken:
  - how can i help you and your pet today
  - i'm juniper
  - the clinic's ai assistant
