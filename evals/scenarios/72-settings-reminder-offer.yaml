id: settings-reminder-offer
title: "Settings: with reminder texts on, the assistant asks once after a booking whether the owner wants one, and records the yes"
clinic: riverbend
local_time: "10:00"
tags: [settings]
settings:
  texting:
    enabled: true
    reminders: { enabled: true, hoursBefore: 24, quietFrom: "20:00", quietTo: "08:00", askOnBooking: true }
turns:
  - caller: Hi, it's Linh Nguyen, I'd like to book a check-up for Biscuit.
    reply: "Thanks, Linh, I've found Biscuit. For a wellness exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one, please.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes, that's right.
    reply: "Biscuit is booked for {booked}."
    delegate:
      - commit_pending: {}
  - caller: Yes please, a reminder would be great.
    reply: "Done, you'll get a text the day before."
    delegate:
      - set_reminder_consent: { agreed: true }
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  spoken_contains: ["Would you like a reminder text before the visit?"]
