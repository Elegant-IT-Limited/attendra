id: vet-T8-swap-wrong-vet
title: "T8 with K1: a visit with a dogs-and-cats vet is never moved to a rabbit; the caller hears why in one line and the vet who sees rabbits is offered (a tester's call, 2026-11-24)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, tester-call, call-bugs]
turns:
  - caller: Hi, Linh Nguyen. I want to add my new rabbit Clover, she's one year old.
    reply: "{registered}"
    delegate:
      - register_patient: { pet_name: Clover, owner_name: Linh Nguyen, species: rabbit, sex: female, birthday_or_age: one year, phone: null }
  - caller: And Biscuit, can he see Dr. Bell on Friday for a sick visit?
    reply: "{offered.0}"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_bell, from_date: "2026-10-02", part_of_day: any }
  - caller: The first one.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "{done}"
    delegate:
      - commit_pending: {}
  - caller: Actually, give that visit to Clover.
    reply: "{the vet line}"
    delegate:
      - list_appointments: {}
      - move_visit_to_pet: { appointment_id: "$appointments[0]", pet_name: Clover }
expect:
  outcome: booked
  verified: true
  refusals: [vet_not_for_animal]
  bookings_created: 1
  sms_sent: 1
  returned: ["Dr. Hana Sato can see Clover"]
  visits_after:
    - { on: "2026-10-02", at: "08:00", visit: vt_sick }
