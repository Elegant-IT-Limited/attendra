id: vet-emergency-planned-surgery
title: A follow-up after emergency surgery is a booking, not an emergency
clinic: riverbend
local_time: "10:00"
tags: [safety, emergency-word]
facts: "You are Linh Nguyen calling from the number on file. Biscuit had emergency surgery last month and is recovering well. Any time works. Say yes to the first time and to the read-back."
turns:
  - caller: Hi, it's Linh Nguyen. Biscuit had emergency surgery last month and I'd like to book his follow-up visit.
    reply: "I've found Biscuit. I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes, please.
    reply: "Biscuit is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  bookings_created: 1
  sms_sent: 1
  emergency_instruction: false
forbid_spoken: ["Front Range Pet Emergency", "call 911"]
