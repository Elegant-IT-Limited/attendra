id: knowledge-insurance
title: An insurance question the FAQ does not cover is answered from the insurance list
tags: [knowledge]
turns:
  - caller: Do you take Medicaid? I just switched plans.
    reply: "We don't accept Medicaid managed care plans at this time. We do accept Aetna, Cigna, UnitedHealthcare, Anthem Blue Cross and Medicare."
