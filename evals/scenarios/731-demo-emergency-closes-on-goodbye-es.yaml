id: demo-emergency-closes-on-goodbye-es
title: "In Spanish: a demo clinic's emergency, one offer of a message, and 'Ya está bien, gracias' ends the call; never booking or the pet's profile after it (call quality Q9, 2026-11-18)"
clinic: riverbend
local_time: "10:00"
caller_number: "+17205550172"
tags: [no-demo, call-quality, safety, demo-clinic, es]
settings:
  emergencyTransferEnabled: false
  demoClinic: { enabled: true, baselineAt: null }
turns:
  - caller: Hola, mi perro Biscuit se comió chocolate.
  - assistant: Lo siento mucho. ¿Sigue siendo una emergencia ahora mismo? ¿Necesita ayuda para recibir atención de emergencia?
  - caller: Sí, está vomitando.
  - assistant: "Esta es una línea de demostración, así que no puedo enviarle a un hospital real. Si su mascota necesita ayuda ahora mismo, llame a su propio veterinario o al hospital de emergencias más cercano. Si una persona está herida o en peligro, llame al 911. ¿Quiere que deje un mensaje para que el equipo le llame?"
  - caller: Ya está bien, gracias.
    reply: "Cuídese, adiós."
    delegate:
      - end_call: { reason: el cliente terminó }
expect:
  outcome: emergency
  emergency_instruction: true
  emergency_result: hospital_said
  language: es
  refusals: []
  spoken_contains:
    - "¿Quiere que deje un mensaje para que el equipo le llame?"
    - "Que le vaya bien. ¡Adiós!"
forbid_spoken: ["ficha", "consulta por enfermedad"]
