id: vet-number-first-unknown-number
title: 'Number first: a number with nothing on it is asked the name like any number (never told "no profile", 2026-11-09), then a new owner and pet are added the usual way and booked'
clinic: riverbend
local_time: "10:00"
caller_number: null
channel: web
tags: [no-demo, number-first]
facts: "A browser test call, no caller ID. You are Sam Rivera. Asked for a number, give only 720 555 0186 and nothing else; say yes when it is read back. When asked your name, give it and say your dog Rex is new, male and three years old. Any time works. Say yes to the first time and the read-back."
turns:
  - caller: Hi, I'd like to book a check-up for my dog.
    reply: "Sure. What phone number is your pet's profile under?"
  - caller: 720 555 0186.
    reply: "That's 720-555-0186?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: null, phone: "720 555 0186" }
  - assistant: "That's 720-555-0186?"
  - caller: Yes.
    reply: "And your name?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: null, phone: "720 555 0186" }
  - caller: Rex, he's new. I'm Sam Rivera, he's three.
    reply: "I've added Rex. I can offer {offered.0}, or {offered.1}."
    delegate:
      - register_patient: { pet_name: Rex, owner_name: Sam Rivera, species: dog, sex: male, birthday_or_age: three years old, phone: "720 555 0186" }
      - find_slots: { visit_type_id: vt_new, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "Rex is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  refusals: [confirm_number, owner_check]
  bookings_created: 1
  returned: ["That's 720-555-0186?", "And your name?"]
  never_returned: ["I don't see a profile under that number."]
  household: { phone: "+17205550186", names: [Rex] }
