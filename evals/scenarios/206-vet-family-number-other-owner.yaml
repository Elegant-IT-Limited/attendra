id: vet-family-number-other-owner
title: "A family number: whoever calls from it is the household and hears every pet on the number to pick from; she picks her own"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, pets-on-number, family-number]
history: "Calls from this number in the last 30 days: 1."
facts: "You are Grace Hale, calling from the family phone. Your cat is Juniper and she needs a check-up. Any vet and any time are fine."
turns:
  - caller: Hi, it's Grace Hale. I'd like to book a check-up.
    reply: "Thanks, Grace. Is this for Biscuit, Mochi or Juniper, or a new pet?"
    delegate:
      - verify_caller: { owner_name: Grace Hale, pet_name: null }
  - caller: For Juniper.
    reply: "I've found Juniper. For a wellness exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Grace Hale, pet_name: Juniper }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
expect:
  outcome: abandoned
  verified: true
  returned: ["Is this for Biscuit, Mochi or Juniper, or a new pet?"]
