id: vet-es-silence-recovery
title: "In Spanish: a turn the voice let go is answered from the caller's own words, in Spanish, never with a request to repeat it"
clinic: riverbend
local_time: "10:00"
tags: [silence]
facts: "You are Linh Nguyen and you speak only Spanish. You are calling from the number on Biscuit's file, the number you are calling from. Biscuit is your dog; you want a wellness exam (un chequeo), any vet, any time. Say sí to the first time offered and to the read-back. If you are asked to repeat what you said, say you already said it (ya se lo dije), a little annoyed."
turns:
  - caller: Hola, soy Linh. Quiero un chequeo para mi perro Biscuit, a cualquier hora.
    dropped: true
    reply: "Disculpe la espera, Linh. Encontré a Biscuit. Para un chequeo tengo {offered.0}, o {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: La primera.
    reply: "Para confirmar: {readback}. ¿Es correcto?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí.
    reply: "Listo. Biscuit tiene cita {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  language: es
forbid_spoken:
  - repetir
  - repita
  - puede decirlo otra vez
  - say that again
