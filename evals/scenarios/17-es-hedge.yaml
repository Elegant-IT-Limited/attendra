id: es-hedge
title: A Spanish "sí, pero espere" is not a yes, and nothing is booked
tags: [language, es]
turns:
  - caller: Buenas noches, habla James Whitaker, 9 de septiembre de 1962. Necesito mi examen físico anual.
    reply: "Gracias, señor Whitaker. Le puedo ofrecer {readback}. ¿Le parece bien?"
    delegate:
      - verify_caller: { full_name: James Whitaker, date_of_birth: 9 de septiembre de 1962 }
      - find_slots: { visit_type_id: vt_annual, provider_id: null, from_date: null, part_of_day: any }
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí, pero espere, mejor otro día. ¿Tiene algo el jueves?
    reply: "Claro, no he reservado nada. Déjeme ver el jueves."
    delegate:
      - commit_pending: {}
expect:
  outcome: abandoned
  refusals: [no_clear_yes]
  bookings_created: 0
  language: es
