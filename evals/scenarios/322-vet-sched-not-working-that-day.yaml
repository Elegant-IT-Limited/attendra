  - caller: Yes.
    reply: "I found Biscuit. Dr. Morgan doesn't work on Tuesdays. She's in Friday and Sunday. On Friday, October 2, I have {offered.0}."
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: null }
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_morgan, from_date: "2026-09-29", part_of_day: any, from_time: null }
  - caller: "Friday at 9 then."
    reply: "{readback}"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Biscuit is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
