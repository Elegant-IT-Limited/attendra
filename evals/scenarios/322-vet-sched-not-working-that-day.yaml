facts: "You are Jordan Avery, calling from the number on file. Biscuit is sick; you want Dr. Morgan, on Tuesday if she is in, otherwise her first day. Say yes."
turns:
  - caller: "Is Dr. Morgan in on Tuesday? Biscuit is sick."
