id: vet-after-three
title: An owner who wants Thursday after 3 hears only Thursday afternoon times from 3, and books one
clinic: riverbend
local_time: "10:00"
facts: "You are calling from the number on file. Any vet is fine. You can only do Thursday after 3 in the afternoon. Say yes to the first time offered after 3 and to the read-back."
turns:
  - caller: Hi, Linh Nguyen. Biscuit needs his check-up, and the only time I can do is Thursday after 3.
    reply: "Thanks, Linh. On Thursday after 3 I have {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: "2026-10-01", part_of_day: afternoon, from_time: "15:00" }
  - caller: The first one is good.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "Biscuit is booked for {booked}. You'll get a text with the details."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  booked_on: "2026-10-01"
  offered_from_time: "15:00"
forbid_spoken: ["particular vet", "particular veterinarian", "morning"]
