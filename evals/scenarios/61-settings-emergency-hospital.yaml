id: settings-emergency-hospital
title: "Settings: the emergency script names the hospital the clinic chose, never the one set before (batch 1b: the one question first)"
clinic: riverbend
tags:
  - settings
  - safety
settings:
  emergencyHospital:
    name: Northside Animal ER
    phone: "+17205550198"
    address: 45 Elm Street, Denver
  emergencyTransferEnabled: false
turns:
  - caller: Please help, my dog just ate a whole bar of dark chocolate and he's shaking.
    reply: I'm sorry, that sounds worrying. Is this still an emergency right now? Do you need help getting emergency care?
  - caller: Yes, please help.
expect:
  outcome: emergency
  emergency_instruction: true
  transfer_to: null
  spoken_contains:
    - Northside Animal ER
    - 45 Elm Street
forbid_spoken:
  - Front Range Pet Emergency
  - Larkspur
