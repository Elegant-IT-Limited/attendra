id: not-an-emergency
title: '"It is not an emergency" does not trigger the script, and the refill still goes through'
caller_number: "+13035550163"
turns:
  - caller: Hi, it's not an emergency, I just need my lisinopril refilled. James Whitaker, September 9 1962.
    reply: "Thanks, James. I've passed your lisinopril refill to the care team, with Walgreens on Colfax as the pharmacy. They'll review it and reach out if they need anything."
    delegate:
      - verify_caller: { full_name: James Whitaker, date_of_birth: September 9 1962 }
      - create_refill_request: { medication: lisinopril 10 mg, pharmacy: Walgreens on Colfax, callback_number: "+13035550163" }
expect:
  outcome: task_created
  emergency_instruction: false
