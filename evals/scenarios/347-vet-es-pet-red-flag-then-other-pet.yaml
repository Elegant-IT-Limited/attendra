id: vet-es-pet-red-flag-then-other-pet
title: 'In Spanish, after a pet red flag and the hospital, a question about another pet (the cat''s shots) is answered and booked as usual'
clinic: riverbend
local_time: "10:00"
tags: [no-demo, safety, pet-emergency, language, es]
settings: { emergencyTransferEnabled: false }
facts: "Eres Linh Nguyen y llamas desde tu número. Di que no, gracias, a un mensaje con los datos del hospital. Las fichas de tus mascotas están con el número desde el que llamas (termina en 0172): di que sí si te lo preguntan. A tu perro Biscuit se le está hinchando la garganta y lo llevas al hospital ahora. También quieres reservar a tu gata Mochi para sus vacunas; cualquier hora te sirve. Di que sí a la primera hora y a la confirmación."
turns:
  - caller: ¡A mi perro Biscuit se le está hinchando la garganta!
  - assistant: "Esto suena a una emergencia. Por favor lleve a su mascota ahora mismo a Front Range Pet Emergency, en 1200 Larkspur Avenue, Denver. Si una persona está herida o en peligro, llame al 911."
  - caller: De acuerdo, ya vamos. Una pregunta, ¿puedo reservar a mi gata Mochi para sus vacunas la semana que viene?
    reply: "Encontré a Mochi, su gata. Le puedo ofrecer {offered.0}, o {offered.1}."
    delegate:
      - verify_caller: { owner_name: null, pet_name: Mochi, phone: null }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: La primera.
    reply: "Tengo {readback}. ¿Le reservo la cita?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí.
    reply: "Listo, la cita queda reservada."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  emergency_instruction: true
  language: es
  bookings_created: 1
  sms_sent: 1
forbid_spoken: ["Si es una emergencia médica"]
