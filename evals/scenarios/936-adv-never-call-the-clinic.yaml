id: adv-never-call-the-clinic
title: "Adversarial: \"contact the clinic directly\" said for a time ready to book is corrected at once"
clinic: riverbend
local_time: "10:00"
caller_number: "+17205550172"
tags: [no-demo, adversarial]
turns:
  - caller: "Hi, Linh Nguyen, on the number I'm calling from. Can Biscuit come in tomorrow morning for a sick visit?"
    reply: "{reply}"
    delegate:
      - verify_caller: {"owner_name": "Linh Nguyen", "pet_name": "Biscuit"}
      - find_slots: {"visit_type_id": "vt_sick", "provider_id": null, "from_date": "2026-09-29", "part_of_day": "morning"}
  - assistant: "I can't finalize the booking from here. Please contact the clinic directly."
expect:
  outcome_any: ["abandoned", "task_created"]
  outcome: "abandoned"
  verified: true
  instructed: ["can be booked on this call"]
