id: vet-sched-many-searches-one-call
title: "Four searches for Friday times with Dr. Vance on one call: every one answered, never \"I can't check any more times on this call\" (a tester call, made-up data)"
clinic: riverbend
local_time: "10:00"
caller_number: "+13035550142"
tags: [no-demo, scheduling-1115, jordan-household]
settings:
  visitTypes:
    - { id: vt_wellness, name: wellness exam, names: { es: chequeo general }, minutes: 30, audience: existing }
    - { id: vt_sick, name: sick visit, names: { es: consulta por enfermedad }, minutes: 20 }
    - { id: vt_vaccines, name: vaccine appointment, names: { es: cita de vacunas }, minutes: 15 }
    - { id: vt_new, name: new patient exam, names: { es: primera consulta }, minutes: 40, audience: new }
    - { id: vt_dental, name: dental care, names: { es: cuidado dental }, minutes: 30 }
    - { id: vt_consult, name: surgery consultation, names: { es: consulta de cirugía }, minutes: 30 }
  providers:
    - { id: prov_morgan, name: Dr. Mara Vance, gender: female, specialty: Surgery, visitTypeIds: [vt_sick, vt_consult, vt_new], hours: { "0": [{ open: "09:00", close: "13:00" }], "5": [{ open: "09:00", close: "13:00" }, { open: "14:00", close: "18:00" }] } }
    - { id: prov_rahman, name: Dr. Omar Rahman, gender: male, specialty: General practice, visitTypeIds: [vt_wellness, vt_sick, vt_vaccines, vt_dental], hours: { "1": [{ open: "08:00", close: "19:00" }], "2": [{ open: "08:00", close: "19:00" }], "3": [{ open: "08:00", close: "19:00" }], "4": [{ open: "08:00", close: "19:00" }], "5": [{ open: "08:00", close: "19:00" }] }, timeOff: [{ from: "2026-10-01", to: "2026-10-01", start: "16:10", end: "16:20", note: team huddle }] }
    - { id: prov_khan, name: Dr. Leila Khan, gender: female, specialty: General practice, visitTypeIds: [vt_wellness, vt_sick, vt_vaccines, vt_dental, vt_new] }
facts: "You are Jordan Avery, calling from the number on file. Biscuit is sick. You ask Dr. Vance about Friday at 8:20, then about 11:00, 2:40 and 5:20 that Friday, one after another, then go back to the 9:00 offered first. Say yes to its read-back."
turns:
  - caller: "Can Biscuit see Dr. Vance on Friday at 8:20? Biscuit is sick."
    reply: "Sure. Is your pet's profile under the number you're calling from, ending 0142?"
  - caller: Yes.
    reply: "I found Biscuit. Dr. Vance starts at 9 on Fridays. The nearest are {offered.0} or {offered.1}."
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: null }
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_morgan, from_date: "2026-10-02", part_of_day: any, from_time: "08:20", time_mode: at }
  - caller: "What about 11:00 on Friday?"
    reply: "{offered.0}"
    delegate:
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_morgan, from_date: "2026-10-02", part_of_day: any, from_time: "11:00", time_mode: at }
  - caller: "What about 2:40 on Friday?"
    reply: "{offered.0}"
    delegate:
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_morgan, from_date: "2026-10-02", part_of_day: any, from_time: "14:40", time_mode: at }
  - caller: "What about 5:20 on Friday?"
    reply: "{offered.0}"
    delegate:
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_morgan, from_date: "2026-10-02", part_of_day: any, from_time: "17:20", time_mode: at }
  - caller: "Actually, the 9:00 you said first."
    reply: "{readback}"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Biscuit is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  booked_with: prov_morgan
  booked_on: "2026-10-02"
  # the 5:20 search answered: its time, in the backend's words, whether the pet was found by then (staged and read
  # back) or not yet ("Yes, 5:20 PM on Friday, October 2 is free")
  returned: ["Friday, October 2, at 5:20 PM"]
forbid_spoken: ["can't check any more", "cannot check more"]
