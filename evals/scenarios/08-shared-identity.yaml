id: shared-name-and-dob
title: Two patients share a name and a birthday; the phone on file tells them apart, and nobody is guessed without it
caller_number: null
turns:
  - caller: Sam Rivera, July 15 1990.
    reply: "Thanks, Sam. What's the phone number on your file?"
    delegate: [{ verify_caller: { full_name: Sam Rivera, date_of_birth: July 15 1990 } }]
  - caller: It's 303 555 0172.
    reply: "Thanks, Sam, I've found your record. How can I help today?"
    delegate: [{ verify_caller: { full_name: Sam Rivera, date_of_birth: July 15 1990, phone: "303 555 0172" } }]
expect:
  outcome: abandoned
  verified: true
  refusals: [phone_required]
