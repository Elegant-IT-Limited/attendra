id: vet-YES-ANY-LANG-si-at-english-clinic
title: "YES-ANY-LANG: at a clinic set to English only, a caller who answers the read-back with 'Sí.' is booked (owner decision, 26 Nov: a plain yes in either language counts at every clinic)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, clear-yes]
settings: { languages: [en], primaryLanguage: en }
turns:
  - caller: Hi, Linh Nguyen. Can Biscuit come in tomorrow morning for a sick visit?
    reply: "{offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_sick, provider_id: null, from_date: "2026-09-29", part_of_day: morning }
  - caller: The first one.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí.
    reply: "All set."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  refusals: []
