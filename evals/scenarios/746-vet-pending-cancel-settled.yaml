id: vet-pending-cancel-settled
title: "A cancel read back, answered 'Yeah, move it to the laser therapy specialist, Monday at 8': the not-offered line, then 'And do you still want me to cancel…?', and the yes cancels it; never left hanging (call quality R4, 2026-11-19)"
clinic: riverbend
local_time: "10:00"
caller_number: "+17205550172"
tags: [no-demo, call-quality, clear-yes]
turns:
  - caller: Hi, Linh Nguyen. Can Biscuit come in tomorrow morning for a sick visit?
    reply: "{offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_sick, provider_id: null, from_date: "2026-09-29", part_of_day: morning }
  - caller: The first one.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yeah.
    reply: "All set, that's booked."
    delegate:
      - commit_pending: {}
  - caller: Actually, can you cancel it?
    reply: "So I'd {readback}. Is that right?"
    delegate:
      - list_appointments: {}
      - propose_cancellation: { appointment_id: "$appointments[0]" }
  - caller: Yeah, move it to the laser therapy specialist on Monday at 8 a.m. Can you do that for me?
    reply: "That isn't something we book here. And do you still want me to cancel it?"
    delegate:
      - find_slots: { visit_type_id: not_offered, provider_id: null, from_date: null, part_of_day: any }
  - caller: Yes, cancel it.
    reply: "Done, that appointment is cancelled."
    delegate:
      - commit_pending: {}
expect:
  outcome: cancelled
  verified: true
  refusals: [unknown_visit_type]
  bookings_created: 1
  sms_sent: 2
  returned: ["And do you still want me to cancel the appointment"]
