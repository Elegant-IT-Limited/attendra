id: vet-background-words-keep-english
title: "An English call with a few words of Spanish from the room (\"la casa\", \"¿qué pasa?\"): the call stays in English, and the next answer is English (call bugs, 2026-11-17)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, call-bugs, language]
turns:
  - caller: Hi, is Dr. Ruiz in today?
    reply: "Let me look. Dr. Elena Ruiz works today."
    delegate:
      - get_clinic_info: { question: is Dr. Ruiz in today }
  - caller: la casa
  - caller: ¿Qué pasa?
  - caller: Sorry about that. Can someone call me back about Biscuit's food?
    reply: "Okay, I've passed that on to the team, and someone will call you back at this number."
    delegate:
      - create_callback: { reason: "Question about Biscuit's food", callback_number: null, topic: null }
expect:
  outcome: task_created
  language: en
  returned: ["I've passed that on to the team"]
  never_returned: ["se lo paso al equipo"]
