id: vet-es-T2-stale-change-replaced-silently
title: "T2 in Spanish: a time read back, then 'mejor la segunda': the new read-back replaces it with no word about the old one, and only the new time is booked (a tester's call, 2026-11-24)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, tester-call, clear-yes, es]
turns:
  - caller: Hola, soy Linh Nguyen. ¿Puede venir Biscuit mañana por la mañana a una consulta por enfermedad?
    reply: "{offered.0}, o {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_sick, provider_id: null, from_date: "2026-09-29", part_of_day: morning }
  - caller: La primera.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Mmm, mejor la segunda.
    reply: "Entonces, {readback}. ¿Le reservo la cita?"
    delegate:
      - propose_booking: { slot_id: "$offered[1]", replaces_appointment_id: null }
  - caller: Sí, por favor.
    reply: "Listo, quedó reservada."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  language: es
  bookings_created: 1
  booked_on: "2026-09-29"
  sms_sent: 1
  never_returned: ["This replaces the change", "will not be done", "tentative", "contact the clinic"]
