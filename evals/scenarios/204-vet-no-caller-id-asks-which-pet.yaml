id: vet-no-caller-id-asks-which-pet
title: "No caller ID (a browser test call): the owner gives her name, is asked for the number on file, and the pets on that number are offered to pick from"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, pets-on-number]
caller_number: null
channel: web
facts: "This is a test call from the browser, so there is no caller ID. You are Linh Nguyen. Your dog Biscuit needs a check-up. The phone number on his file is 720 555 0172."
turns:
  - caller: Hi, this is Linh Nguyen. I'd like to book a check-up.
    reply: "Thanks, Linh. What phone number is your pet's profile under?"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: null, phone: null }
  - caller: It's 720 555 0172.
    reply: "That's 720-555-0172?"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: null, phone: "720 555 0172" }
  - assistant: "That's 720-555-0172?"
  - caller: Yes, that's right.
    reply: "Thanks, Linh. Is this for Biscuit or Mochi, or a new pet?"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: null, phone: "720 555 0172" }
  - caller: For Biscuit.
    reply: "Thanks, I've found Biscuit. For a wellness exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit, phone: "720 555 0172" }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
expect:
  outcome: abandoned
  verified: true
  refusals: [phone_required, confirm_number]
  returned: ["Thanks, Linh. Is this for Biscuit or Mochi, or a new pet?"]
