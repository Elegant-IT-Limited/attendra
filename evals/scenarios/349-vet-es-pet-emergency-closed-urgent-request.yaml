settings:
  emergencyTransferEnabled: false
facts: Eres Linh Nguyen y llamas desde tu número fuera de horario. Di que no, gracias, a un mensaje con los datos del hospital. Tu gata Mochi se está ahogando. Quieres que la vean mañana; di que sí a un mensaje urgente para el equipo.
turns:
  - caller: ¡Mi gata Mochi se está ahogando con algo!
  - assistant: Lo siento mucho. ¿Sigue siendo una emergencia ahora mismo? ¿Necesita ayuda para recibir atención de emergencia?
  - caller: Sí, por favor ayúdeme.
  - assistant: Por favor lleve a su mascota ahora mismo a Front Range Pet Emergency, en 1200 Larkspur Avenue, Denver. Su número es uno siete dos cero cinco cinco cinco cero uno ocho ocho. Si una persona está herida o en peligro, llame al 911.
  - caller: ¿Alguien la puede ver mañana por la mañana?
    reply: Ahora mismo no puedo reservar una visita de rutina para su mascota, con lo que está pasando. Puedo enviarle a nuestro equipo un mensaje urgente para que le llamen lo antes posible. ¿Quiere?
    delegate:
      - find_slots:
          visit_type_id: vt_sick
          provider_id: null
          from_date: null
          part_of_day: morning
  - caller: Sí, por favor.
    reply: Le envié esto al equipo como urgente, y alguien le llamará lo antes posible.
    delegate:
      - create_callback:
          reason: Mochi se ahogaba; quieren que la vean mañana
          callback_number: null
