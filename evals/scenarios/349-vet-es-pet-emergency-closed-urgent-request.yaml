id: vet-es-pet-emergency-closed-urgent-request
title: "In Spanish, after hours, a pet emergency then a request to be seen tomorrow: no booking, an urgent request for the team (batch 1b: the one question first)"
clinic: riverbend
tags:
  - no-demo
  - safety
