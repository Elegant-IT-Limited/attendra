  household: { phone: "+17205550165", names: [Tango, Pico, Juno] }
  pet_on_file: { phone: "+17205550165", name: Juno, species: conejo }
  visits_after:
    - { on: "2026-09-30", at: "08:00", visit: vt_vaccines }
