id: vet-es-emergency-denied-after-warning
title: An owner who says, in Spanish, it's not an emergency after hearing the hospital carries on and books
clinic: riverbend
local_time: "10:00"
tags: [no-demo, safety, emergency-word, language, es]
settings: { emergencyTransferEnabled: false }
turns:
  - caller: Hola, Biscuit mordió un calcetín.
  - assistant: "Esto suena a una emergencia. Por favor lleve a su mascota ahora mismo a Front Range Pet Emergency, en 1200 Larkspur Avenue, Denver. Si una persona está herida o en peligro, llame al 911."
  - caller: No, no es una emergencia, olvídelo, no está herido. Ya lo expulsó ayer. Soy Linh Nguyen, solo quiero una revisión para Biscuit.
    reply: "Me alegra que esté bien. ¿La ficha de su mascota está con el número desde el que llama, que termina en 0172?"
  - caller: Sí, es mi número. Cualquier hora de esta semana me sirve.
    reply: "Encontré a Biscuit, su perro. Le puedo ofrecer {offered.0}, o {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: La primera.
    reply: "Para confirmar: {readback}. ¿Es correcto?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí.
    reply: "Biscuit quedó reservado para {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  emergency_instruction: true
  language: es
