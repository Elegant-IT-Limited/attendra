id: settings-english-only
title: "Settings: a clinic that answers in English only stays in English when the caller speaks Spanish"
clinic: riverbend
local_time: "10:00"
tags: [settings]
settings:
  languages: [en]
  primaryLanguage: en
turns:
  - caller: Hola, ¿dónde están ubicados? ¿Dónde puedo estacionar?
