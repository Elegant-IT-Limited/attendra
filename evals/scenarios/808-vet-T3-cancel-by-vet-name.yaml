id: vet-T3-cancel-by-vet-name
title: 'T3: two visits booked on the call with two vets, then "I had another booking with Dr. Elena, just cancel that booking": the one with Dr. Ruiz is cancelled, never the visit booked last (a tester''s call, 2026-11-24)'
clinic: riverbend
local_time: "10:00"
tags: [no-demo, tester-call, call-bugs]
turns:
  - caller: Hi, Linh Nguyen. Can Biscuit see Dr. Ruiz tomorrow for a sick visit?
    reply: "{offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_sick, provider_id: prov_ruiz, from_date: "2026-09-29", part_of_day: any }
  - caller: The first one.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "Done."
    delegate:
      - commit_pending: {}
  - caller: And can he see Dr. Bell on Wednesday for his vaccines?
    reply: "{offered.0}, or {offered.1}."
    delegate:
      - find_slots: { visit_type_id: vt_vaccines, provider_id: prov_bell, from_date: "2026-09-30", part_of_day: any }
  - caller: The first one.
    reply: "{readback}?"
    delegate:
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: null }
  - caller: Yes.
    reply: "Done."
    delegate:
      - commit_pending: {}
  - caller: I had another booking with Dr. Elena, just cancel that booking.
    reply: "So I'd {readback}. Is that right?"
    delegate:
      - list_appointments: {}
      - propose_cancellation: { appointment_id: "$appointments[1]" }
      - propose_cancellation: { appointment_id: "$appointments[0]" }
  - caller: Yes, cancel it.
    reply: "Done, that appointment is cancelled."
    delegate:
      - commit_pending: {}
expect:
  outcome: cancelled
  verified: true
  refusals: [which_visit]
  bookings_created: 2
  sms_sent: 3
  returned: ["the caller means"]
  never_returned: ["booked on this call"]
  visits_after:
    - { on: "2026-09-30", at: "08:00", visit: vt_vaccines }
