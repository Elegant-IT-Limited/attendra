id: vet-es-move-cancel-move-two-visits
title: "In Spanish, the test call's whole sequence with made-up data: a second visit booked, moved, \"cancélela\" with the time picked, then \"¿y el viernes?\": only the visit the caller picked ever changes (call bugs, 2026-11-17)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, has-appointment-today, call-bugs, es]
turns:
  - caller: Hola, soy Linh Nguyen. Quiero un chequeo general para Biscuit hoy, después de las 4.
    reply: "Biscuit ya tiene una cita: chequeo general, hoy a las 2:00 PM, con la Dra. Elena Ruiz. ¿Quiere cambiar esa cita o reservar otra además?"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: "2026-09-28", part_of_day: any, from_time: "16:00", time_mode: after }
  - caller: Otra, por favor.
    reply: "Hoy tengo {offered.0}, o {offered.1}."
    delegate:
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: "2026-09-28", part_of_day: any, from_time: "16:00", time_mode: after }
  - caller: La primera.
    reply: "Tengo {readback}. ¿Le reservo la cita?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Sí."
    reply: "Listo, la cita queda reservada."
    delegate:
      - commit_pending: {}
  - caller: En realidad, ¿la puede cambiar al viernes?
    reply: "Entonces, quiere {readback}. ¿Hago el cambio?"
    delegate:
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: "2026-10-02", part_of_day: any }
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: "$put_forward" }
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: "$booked" }
  - caller: No, perdone, mejor cancélela.
    reply: "Biscuit tiene dos citas hoy, a las 2:00 PM y a las 4:00 PM. ¿Cuál cancelo?"
    delegate:
      - list_appointments: {}
  - caller: "La de las 4:00."
    reply: "Entonces, quiere {readback}. ¿Es correcto?"
    delegate:
      - propose_cancellation: { appointment_id: "$booked" }
  - caller: ¿Y el viernes? ¿La cambia al viernes?
    reply: "De acuerdo, no la cancelo. Entonces, quiere {readback}. ¿Hago el cambio?"
    delegate:
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: "$put_forward" }
      - propose_booking: { slot_id: "$found[0]", replaces_appointment_id: "$booked" }
  - caller: "Claro, ¿ya quedó?"
    reply: "Listo, la cita queda cambiada."
    delegate:
      - commit_pending: {}
expect:
  outcome: rescheduled
  verified: true
  language: es
  refusals: [which_visit, which_visit]
  bookings_created: 2
  sms_sent: 2
  sms_templates: [booking_confirmed, change_confirmed]
  visits_after:
    - { on: "2026-09-28", at: "14:00", visit: vt_wellness }
    - { on: "2026-10-02", at: "16:00", visit: vt_wellness }
  returned: ["the visit booked on this call", "the one the caller named", "This replaces the change that was waiting for a yes"]
