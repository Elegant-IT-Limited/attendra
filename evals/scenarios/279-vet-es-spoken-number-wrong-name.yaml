id: vet-es-spoken-number-wrong-name
title: "Spanish, at a clinic whose main language is Spanish: a spoken number and a name that is not the owner's (\"Alex\"); still booked, nothing from the record is said, never the owner's name, and the appointment note for the team says \"reservada por quien llamó: Alex\""
clinic: riverbend
local_time: "10:00"
caller_number: null
channel: web
tags: [no-demo, record, safety, jordan-household, language, es]
settings:
  primaryLanguage: es
facts: "Es una llamada de prueba desde el navegador, sin identificador de llamadas. Eres Alex, amigo del dueño, y hablas español; reservas para Biscuit. El número de la ficha es 303 555 0142. Preguntas cuándo fue la última visita de Biscuit. Cualquier veterinario y cualquier hora te sirven; acepta la primera hora y di sí a la confirmación."
turns:
  - caller: Hola, quiero reservar un chequeo para Biscuit.
    reply: "Claro. ¿Con qué número de teléfono está registrada la ficha de su mascota?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: null }
  - caller: El 303 555 0142.
    reply: "¿Es el 303-555-0142?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: "303 555 0142" }
  - assistant: "¿Es el 303-555-0142?"
  - caller: Sí.
    reply: "¿Y su nombre?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: Biscuit, phone: "303 555 0142" }
  - caller: Alex.
    reply: "Encontré a Biscuit. Tengo {offered.0}, o {offered.1}."
    delegate:
      - verify_caller: { owner_name: Alex, pet_name: Biscuit, phone: "303 555 0142" }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: Por cierto, ¿cuándo fue su última visita?
    reply: "No puedo dar detalles de la ficha en esta llamada, pero sí puedo reservar la cita. ¿Le sirve la primera hora?"
    delegate:
      - visit_summary: {}
  - caller: Sí, la primera.
    reply: "Tengo {readback}. ¿Es correcto?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Sí.
    reply: "Listo, la cita de Biscuit queda reservada."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  language: es
  refusals: [phone_required, confirm_number, owner_check, not_verified]
  bookings_created: 1
  sms_sent: 1
  spoken_contains: ["¿Y su nombre?"]
  never_returned: ["Jordan", "Avery", "last_visit", "usual_vet", "next_visits"]
  appointment_note_contains: ["reservada por quien llamó: Alex"]
forbid_spoken: ["Jordan", "Avery", "no tengo su nombre"]
