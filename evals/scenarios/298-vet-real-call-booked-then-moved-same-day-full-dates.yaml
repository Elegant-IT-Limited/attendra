id: vet-real-call-booked-then-moved-same-day-full-dates
title: "A real call, step 5 (made-up data): booked Wednesday at 5:30, then \"make it 4:30\" stays on that Wednesday, never the next one, and every offer and read-back says the weekday, the date and the time; the move says both"
clinic: riverbend
local_time: "10:00"
caller_number: null
channel: web
tags: [no-demo, from-call, dates, move, jordan-household]
facts: "This is a test call from the browser, so there is no caller ID. You are Jordan Avery. The number on file is 303 555 0142. Your cat Pepper needs a check-up on Wednesday at 5:30; once it is booked, you ask to make it 4:30. Say yes to each read-back."
turns:
  - caller: Hi, this is Jordan. I'd like a check-up for Pepper on Wednesday at 5:30.
    reply: "Sure. What phone number is your pet's profile under?"
    delegate:
      - verify_caller: { owner_name: Jordan, pet_name: Pepper, phone: null }
  - caller: 303 555 0142.
    reply: "That's 303-555-0142?"
    delegate:
      - verify_caller: { owner_name: Jordan, pet_name: Pepper, phone: "303 555 0142" }
  - assistant: "That's 303-555-0142?"
  - caller: Yes.
    reply: "I found Pepper, your cat. I have {offered.0}."
    delegate:
      - verify_caller: { owner_name: Jordan, pet_name: Pepper, phone: "303 555 0142" }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, from_time: null, part_of_day: any }
  - caller: The 5:30, please.
    reply: "{readback}"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Pepper is booked for {booked}."
    delegate:
      - commit_pending: {}
  - caller: Hmm, can you make it 4:30 instead?
    reply: "I have {offered.3}."
    delegate:
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, from_time: null, part_of_day: any }
  - caller: Yes, that one.
    reply: "{readback}"
    delegate:
      - propose_booking: { slot_id: "$offered[3]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Done, it's moved."
    delegate:
      - commit_pending: {}
expect:
  outcome: rescheduled
  verified: true
  refusals: [phone_required, confirm_number]
  bookings_created: 2
  sms_sent: 2
  booked_on: "2026-09-30"
  not_offered_on: ["2026-10-07"]
  spoken_contains: ["Wednesday, September 30, at 5:30 PM", "from Wednesday, September 30, at 5:30 PM to Wednesday, September 30, at 4:30 PM"]
forbid_spoken: ["October 7", "best number"]
