id: vet-caller-id-no-name-question
title: "Caller ID on a known number, said yes to: greeted by the owner's name on file and asked which pet; never asked for a name"
clinic: riverbend
local_time: "10:00"
caller_number: "+13035550142"
tags: [no-demo, record, jordan-household]
facts: "You are Jordan Avery, calling from the number on file. Your cat Pepper needs a check-up. Any vet and any time are fine; take the first time and say yes to the read-back."
turns:
  - caller: Hi, I'd like to book a check-up.
    reply: "Sure. Is your pet's profile under the number you're calling from, ending 0142?"
  - caller: Yes, it is.
    reply: "Thanks, Jordan. Is this for Biscuit or Pepper, or a new pet?"
    delegate:
      - verify_caller: { owner_name: null, pet_name: null, phone: null }
  - caller: Pepper.
    reply: "I found Pepper, your cat. I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: null, pet_name: Pepper, phone: null }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Pepper is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  spoken_contains: ["Thanks, Jordan. Is this for Biscuit or Pepper, or a new pet?"]
  appointment_note_empty: true
forbid_spoken: ["your name", "owner's first name"]
