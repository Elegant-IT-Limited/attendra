id: vet-one-new-question-per-call
title: "One question about \"new\" per call: caller ID knows the owner, so she is asked only \"Is this for Biscuit or Mochi, or a new pet?\"; describing Mochi after picking her never brings \"Is Mochi new to us?\""
clinic: riverbend
local_time: "10:00"
tags: [no-demo, pets-on-number, new-pet]
history: "Name on file for this number: Linh.\nCalls from this number in the last 30 days: 1."
facts: "You are Linh Nguyen, calling from the number on file. Your pets are Biscuit (dog) and Mochi (cat). When asked which pet, you say Mochi and describe her: a two-year-old female cat. You want a wellness exam, any vet, any time. Take the first time offered and say yes to the read-back."
turns:
  - caller: Hi, I'd like to book a check-up, please.
    reply: "Am I speaking with Linh?"
  - caller: Yes, that's me.
    reply: "Thanks, Linh. Is this for Biscuit or Mochi, or a new pet?"
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: null }
  - assistant: Is this for Biscuit or Mochi, or a new pet?
  # she describes the pet the way a new client does: the pick question already covered "new", so no second question
  - caller: It's for Mochi, she's a two-year-old female cat.
    reply: "For a wellness exam for Mochi I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh, pet_name: Mochi }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Mochi is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  refusals: []
  bookings_created: 1
  sms_sent: 1
  returned: ["Is this for Biscuit or Mochi, or a new pet?"]
  never_returned: ["new to us"]
forbid_spoken:
  - new to us
