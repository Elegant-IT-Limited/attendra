id: vet-can-i-see-ruiz
title: '"Can I see Ruiz?" is answered with "Dr. Ruiz": the title is built in, with the name stored without it'
clinic: riverbend
local_time: "10:00"
tags: [settings, vet-titles]
settings:
  providers:
    - { id: prov_ruiz, name: Elena Ruiz, title: dr, gender: female, specialty: General practice, categories: [Dogs, Cats, Dentistry], visitTypeIds: [vt_wellness, vt_sick, vt_vaccines, vt_new], phone: "+17205550191" }
    - { id: prov_bell, name: Marcus Bell, title: dr, gender: male, specialty: General practice, categories: [Dogs, Cats, Senior pets], visitTypeIds: [vt_wellness, vt_sick, vt_vaccines, vt_new], phone: "+17205550192" }
turns:
  - caller: Hi, it's Linh Nguyen. Can Biscuit see Ruiz for a check-up?
    reply: "Sure. Is your pet's profile under the number you're calling from, ending 0172?"
  - caller: Yes.
    reply: "I found Biscuit, your dog. With Dr. Ruiz I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: prov_ruiz, from_date: null, part_of_day: any }
expect:
  outcome: abandoned
  verified: true
  returned: ["Dr. Elena Ruiz"]
  never_returned: ["Dr. Dr."]
