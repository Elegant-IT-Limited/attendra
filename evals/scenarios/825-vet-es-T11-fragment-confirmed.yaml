id: vet-es-T11-fragment-confirmed
title: "T11 in Spanish: \"It's Sunny.\" on a Spanish call is asked back ('Sunny es el nombre de la mascota, ¿verdad?') before the pet is added; a yes adds it (a tester's call, 2026-11-24)"
clinic: riverbend
local_time: "10:00"
caller_number: "+17205550168"
tags: [no-demo, tester-call, identity, es]
turns:
  - caller: Hola, soy Corin Vale. Quiero registrar una perra nueva, tiene como un año.
  - assistant: "¿Cómo se llama?"
  - caller: It's Sunny.
    reply: "Sunny es el nombre de la mascota, ¿verdad?"
    delegate:
      - register_patient: { pet_name: Sunny, owner_name: Corin Vale, species: perro, sex: female, birthday_or_age: como un año, phone: null }
  - caller: Sí.
    reply: "Sunny quedó registrada."
    delegate:
      - register_patient: { pet_name: Sunny, owner_name: Corin Vale, species: perro, sex: female, birthday_or_age: como un año, phone: null }
expect:
  outcome: abandoned
  verified: true
  language: es
  refusals: [confirm_pet_name]
  returned: ["Sunny es el nombre de la mascota, ¿verdad?"]
  pet_on_file: { phone: "+17205550168", name: Sunny, species: perro }
