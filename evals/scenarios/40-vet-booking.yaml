id: vet-booking
title: A pet owner is found by their name, the pet's name and their phone, and books a wellness exam on a clear yes
clinic: riverbend
local_time: "10:00"
facts: "You are calling from the number on file. Any time works, with any vet. Say yes to the first time offered and to the read-back."
turns:
  - caller: Hi, this is Linh Nguyen. I'd like to book a check-up for my dog Biscuit.
    reply: "Thanks, Linh, I've found Biscuit. For a wellness exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one, please.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes, that's right.
    reply: "Biscuit is booked for {booked}. I've sent a text confirmation to your number."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
forbid_spoken: [diagnos, "you should give"]
