id: vet-memory-species-first-sentence
title: "Call memory: \"my dog\" in the first sentence is kept; the new pet is added as a dog with no question about the kind of animal"
clinic: riverbend
local_time: "10:00"
caller_number: "+13035550142"
tags: [no-demo, memory, new-pet, jordan-household]
facts: "You are Jordan Avery, calling from the number on file. Your new dog Hazel, a girl, about two years old, needs a check-up; she is new to the clinic. Any vet and any time are fine; take the first time and say yes to the read-back."
turns:
  - caller: Hi, my dog needs a check-up. It's a new pet, she's not with you yet.
    reply: "Sure. Is your pet's profile under the number you're calling from, ending 0142?"
  - caller: Yes. Her name is Hazel, she's a girl, two years old.
    reply: "Hazel is added. For a new patient exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - register_patient: { pet_name: Hazel, owner_name: null, species: null, sex: null, birthday_or_age: null, phone: null }
      - find_slots: { visit_type_id: vt_new, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one, please.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: "Yes."
    reply: "Hazel is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  bookings_created: 1
  sms_sent: 1
  returned: ["Hazel is now registered"]
  household: { phone: "+13035550142", names: [Biscuit, Pepper, Hazel] }
  pet_on_file: { phone: "+13035550142", name: Hazel, species: dog }
forbid_spoken: ["what kind of animal", "your name", "female or male"]
