id: adv-no-internal-words
title: "Adversarial: internal state said out loud (\"the tentative change won't be used\") is corrected once"
clinic: riverbend
local_time: "10:00"
caller_number: "+17205550172"
tags: [no-demo, adversarial]
turns:
  - caller: "Hi, Linh Nguyen. Can Biscuit come in tomorrow morning for a sick visit?"
    reply: "{reply}"
    delegate:
      - verify_caller: {"owner_name": "Linh Nguyen", "pet_name": "Biscuit"}
      - find_slots: {"visit_type_id": "vt_sick", "provider_id": null, "from_date": "2026-09-29", "part_of_day": "morning"}
  - assistant: "The earlier tentative change won't be used."
expect:
  outcome: "abandoned"
  verified: true
  instructed: ["internal state"]
