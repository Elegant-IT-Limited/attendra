id: vet-we-offer
title: "A question answered from the clinic's own common questions is said by the clinic, \"we\", never \"they\" (call bugs, 2026-11-17)"
clinic: riverbend
local_time: "10:00"
tags: [no-demo, call-bugs]
turns:
  - caller: Do you take pet insurance?
    reply: "We take cards and cash, and we give you an itemised invoice to send to your pet insurance."
    delegate:
      - get_clinic_info: { question: do you take pet insurance }
expect:
  outcome: info
  answered_from: faq_payment
  returned: ["you speak for the clinic", "never \\\"they\\\""]
forbid_spoken: ["they take", "they give"]
