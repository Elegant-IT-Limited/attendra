id: vet-said-new-registers
title: An owner who says at once that the pet is new is never looked up; each detail is asked once, and the pet is added and booked
clinic: riverbend
local_time: "10:00"
tags: [new-pet]
caller_number: "+17205550181"
facts: "You are Nora Quinn, calling from your own mobile, the number you are calling from. Pixel is your female dog, about a year old, and she has never been to this clinic. You already said she is new and a dog: if you are asked again, say so, a little annoyed. Any vet and any time are fine. Say yes to the first time offered and to the read-back."
turns:
  # the plan looks the pet up anyway, on purpose: the backend refuses, since the caller said she is new
  - caller: Hi, I'd like to register my dog with you. I'm Nora Quinn and her name is Pixel. She's new, she's never been to your clinic.
    reply: "Welcome, Nora. I can add Pixel. How old is she?"
    delegate:
      - verify_caller: { owner_name: Nora Quinn, pet_name: Pixel }
  - caller: She's about a year old.
    reply: "Thanks. Pixel is added. For a new patient exam I can offer {offered.0}, or {offered.1}."
    delegate:
      - register_patient: { pet_name: Pixel, owner_name: Nora Quinn, species: dog, sex: female, birthday_or_age: about a year old, phone: null }
      - find_slots: { visit_type_id: vt_new, provider_id: null, from_date: null, part_of_day: any }
  - caller: The first one.
    reply: "Just to confirm: {readback}. Is that right?"
    delegate:
      - propose_booking: { slot_id: "$offered[0]", replaces_appointment_id: null }
  - caller: Yes please.
    reply: "Pixel is booked for {booked}."
    delegate:
      - commit_pending: {}
expect:
  outcome: booked
  verified: true
  refusals: [pet_is_new]
  bookings_created: 1
  sms_sent: 1
forbid_spoken:
  - couldn't find
  - is she new
  - is pixel new
  - what kind of animal
  - female or male
  - your first name
  - number on pixel's file
