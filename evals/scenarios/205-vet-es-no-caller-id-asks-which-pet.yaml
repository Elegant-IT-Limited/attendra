      - verify_caller: { owner_name: Linh Nguyen, pet_name: null, phone: null }
  - caller: Para Biscuit.
    reply: "¿Cuál es el teléfono de la ficha de Biscuit?"
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit, phone: null }
  - caller: Es el 720 555 0172.
    reply: "Gracias, encontré a Biscuit. Para un chequeo general tengo {offered.0}, o {offered.1}."
    delegate:
      - verify_caller: { owner_name: Linh Nguyen, pet_name: Biscuit, phone: "720 555 0172" }
      - find_slots: { visit_type_id: vt_wellness, provider_id: null, from_date: null, part_of_day: any }
expect:
  outcome: abandoned
