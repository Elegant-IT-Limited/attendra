  clinic: riverbend
  caller_number: "+17205550172"
  persona: "Linh Nguyen. Organised. Wants to sort both pets in one call: Biscuit's wellness exam and Mochi's vaccines, back to back if possible, any day."
  goal: Book a wellness exam for Biscuit and a vaccine appointment for Mochi. Say yes to each read-back. Then say goodbye.
