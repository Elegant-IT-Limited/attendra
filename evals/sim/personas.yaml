  goal: Book Mochi's vaccines on Thursday afternoon, after changing her mind twice. Say yes to the read-back of a Thursday afternoon time.
  expect: [booked]
- id: vet-rescue-dog-new-client
  clinic: riverbend
  caller_number: "+17205550195"
