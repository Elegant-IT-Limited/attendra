name: Feature request
description: Propose a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: Who needs this, and what do they do today without it? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not ask the agent to give medical advice, triage or approve prescriptions
          required: true
