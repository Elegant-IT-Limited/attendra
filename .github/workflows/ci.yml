name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: unit, integration and eval scenarios (Postgres in-process)
        run: pnpm test
      # The same scenarios already passed in the step above; this prints the report. Node
      # 24.21.0 twice crashed inside V8 here (exit 133, a signal) under the in-process
      # Postgres, so a crash by signal is tried once more. A failed scenario is not.
      # It runs node directly: `pnpm eval` goes through `pnpm --filter`, which turns any
      # failure into exit 1, so the guard never saw the 133. Dry run (a child that dies on
      # SIGTRAP as the crash did): `pnpm --filter` exit 1, `node` exit 133.
      - name: eval report
        working-directory: evals
        run: |
          set +e
          node --import tsx src/run.ts; code=$?
          if [ "$code" -ge 128 ]; then echo "::warning::eval report crashed (exit $code); running it once more"; node --import tsx src/run.ts; code=$?; fi
          exit $code
        env: { FORCE_COLOR: '1' }
      - name: dashboard builds
        run: pnpm --filter @attendra/web build
        env: { NEXT_TELEMETRY_DISABLED: '1' }

  # The team, invitation, profile and role tests again on the Postgres image production runs
  # (with its roles and row-level security), not the in-process one: tester finding 2
  # (2026-11-04), a profile save that failed on production and never in tests.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: your profile, the team, invitations and every role, on a real Postgres
        run: pnpm exec vitest run packages/db/test/clinic-access.test.ts packages/db/test/invitations.test.ts apps/api/test/profile.test.ts apps/api/test/invitations.test.ts apps/api/test/roles.test.ts apps/api/test/password.test.ts
        env: { ATTENDRA_TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres' }
      # The services' own role (migration 0051): every repository, the API, the worker and MCP,
      # logged in as attendra_service, which no row-level security policy lets past. A query that
      # forgets its clinic fails here, not on production. The voice service is not in it yet.
      - name: the database, API, worker and MCP as attendra_service, on a real Postgres
        run: pnpm exec vitest run packages/db apps/api apps/worker apps/mcp packages/knowledge packages/scheduling packages/telephony packages/webhooks
        env: { ATTENDRA_TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres', ATTENDRA_TEST_AS: service }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @attendra/web exec playwright install --with-deps chromium
      - name: dashboard end to end (demo API on an in-memory Postgres)
        run: pnpm test:e2e
        env: { NEXT_TELEMETRY_DISABLED: '1' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        # CI reports to the log only (github, list), so there is no HTML report: the traces of the failed tests are in test-results
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }

  # No real people, pets, clinics, phone numbers, addresses or emails in this public repo
  # (CONTRIBUTING.md, Privacy). The private list is a repository secret, so a fork's pull
  # request checks the public rules only; findings never print the words they matched.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.22.1 }
      - name: the files, and the pull request's title, body and commit messages
        run: node scripts/privacy-check.mjs
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The gitleaks CLI, pinned and checksum-verified. (The gitleaks GitHub Action
      # needs a licence key on organisation repositories; the CLI does not.)
      - name: scan the full history for secrets
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: every commit is signed off (DCO)
        run: |
          # the pull request's own commits: HEAD here is GitHub's merge commit, which is never signed
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | awk 'NF==1 {print $1}')
          if [ -n "$missing" ]; then echo "commits without Signed-off-by:"; echo "$missing"; exit 1; fi
