# The engine's images, built here instead of on the server, and pushed to GitHub's container
# registry: every push to main and every release tag.
#   ghcr.io/elegant-it-limited/attendra-engine   API, worker, voice, MCP and the migrations (infra/Dockerfile)
#   ghcr.io/elegant-it-limited/attendra-web      the dashboard (infra/web.Dockerfile, built for API_URL=http://api:8081,
#                                                the address the compose files give the API)
# Tags: the full commit SHA always; `main` for the newest main; the version for a release tag (v0.9.0).
# A server pulls a SHA, never `main`, so what runs is always one known commit.
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # forks push to their own registry, if anywhere
    if: github.repository == 'Elegant-IT-Limited/attendra'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: attendra-engine, dockerfile: infra/Dockerfile, build_arg: '' }
          - { image: attendra-web, dockerfile: infra/web.Dockerfile, build_arg: 'API_URL=http://api:8081' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plain docker and buildx, already on the runner: no third-party action holds the token
      - name: sign in to the registry
        env: { TOKEN: '${{ secrets.GITHUB_TOKEN }}', ACTOR: '${{ github.actor }}' }
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build and push
        env:
          IMAGE: ghcr.io/elegant-it-limited/${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARG: ${{ matrix.build_arg }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$GITHUB_SHA")
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then tags+=(--tag "$IMAGE:main"); fi
          if [ "$REF_TYPE" = "tag" ]; then tags+=(--tag "$IMAGE:$REF_NAME"); fi
          args=()
          if [ -n "$BUILD_ARG" ]; then args+=(--build-arg "$BUILD_ARG"); fi
          # a builder that can keep its layer cache in the registry, so an unchanged lockfile skips the install
          docker buildx create --driver docker-container --use > /dev/null
          docker buildx build . --file "$DOCKERFILE" "${args[@]}" "${tags[@]}" \
            --label "org.opencontainers.image.source=$REPO_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --push
          echo "pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
