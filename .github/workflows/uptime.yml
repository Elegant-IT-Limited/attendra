# Uptime: every 10 minutes, from GitHub's servers, outside ours: is Attendra answering?
# A server that is down cannot say so itself, so this check lives elsewhere. Each address
# gets three tries 20 s apart; one that still fails is posted to Slack (the repository
# secret UPTIME_SLACK_WEBHOOK_URL) and fails the run. Free: the repository is public.
# A site that is down is a P0: with the secret UPTIME_PAGER_NTFY_URL (an ntfy topic, as
# ATTENDRA_PAGER_NTFY_URL on the server) it also pages the on-call phone, and with the
# repository variable RUNBOOK_URL the page links to <RUNBOOK_URL>/not-answering.md.
name: uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      slack_test:
        description: Also post a test line to Slack, to check the alert path
        type: boolean
        default: false

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    # forks have no reason to watch our servers
    if: github.repository == 'Elegant-IT-Limited/attendra'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the website, the dashboard, the API and the voice service
        env:
          SLACK: ${{ secrets.UPTIME_SLACK_WEBHOOK_URL }}
          SLACK_TEST: ${{ inputs.slack_test }}
          PAGER: ${{ secrets.UPTIME_PAGER_NTFY_URL }}
          RUNBOOK_URL: ${{ vars.RUNBOOK_URL }}
        run: |
          # a run started by hand can check the Slack path itself; a failure here is said in the run
          if [ "$SLACK_TEST" = "true" ]; then
            if [ -z "$SLACK" ]; then echo "::error::UPTIME_SLACK_WEBHOOK_URL is not set"; exit 1; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"text":"[uptime] :white_check_mark: Test: the outside uptime check can post here. Nothing is wrong."}' "$SLACK" || true)
            echo "slack test -> $code"
            [ "$code" = "200" ] || { echo "::error::Slack answered $code"; exit 1; }
          fi
          # what to call, how, and the answers that mean "up"
          checks=(
            "GET https://getattendra.com/ 200 website"
            "GET https://app.getattendra.com/sign-in 200 dashboard"
            # 503 when the API is up but its database is not: still down
            "GET https://app.getattendra.com/api/v1/health 200 api"
            "GET https://app.getattendra.com/account/signup 200 account-pages"
            "POST https://app.getattendra.com/webhooks/openai 400,401 voice-service"
          )
          down=()
          for c in "${checks[@]}"; do
            read -r method url want name <<< "$c"
            code=000
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" --max-time 15 "$url" || true)
              [[ ",$want," == *",$code,"* ]] && break
              if [ "$try" -lt 3 ]; then sleep 20; fi
            done
            echo "$name $method $url -> $code (up: $want)"
            [[ ",$want," == *",$code,"* ]] || down+=("$name ($code)")
          done
          if [ ${#down[@]} -gt 0 ]; then
            text="[uptime] :rotating_light: Attendra is not answering from outside: ${down[*]}. Checked 3 times, 20 s apart. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$SLACK" ]; then
              curl -s -o /dev/null -X POST -H 'content-type: application/json' --data "$(jq -n --arg t "$text" '{text: $t}')" "$SLACK" || true
            fi
            # the page: once per failed run, which is at most every 10 minutes
            if [ -n "$PAGER" ]; then
              link=; case "$RUNBOOK_URL" in https://*) link="${RUNBOOK_URL%/}/not-answering.md" ;; esac
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Title: Attendra P0: not answering (uptime)' -H 'Priority: urgent' -H 'Tags: rotating_light' \
                ${link:+-H "Click: $link"} --data-binary "$text${link:+ Runbook: $link}" "$PAGER" || true)
              [ "$code" = "200" ] || echo "::warning::the pager answered $code"
            fi
            echo "::error::$text"
            exit 1
          fi
