# Local stack: Postgres, the migrations, the seed, the dashboard API and the dashboard.
#   cp .env.example .env   # set ATTENDRA_DATA_KEY and BETTER_AUTH_SECRET
#   docker compose -f infra/docker-compose.yml up              # dashboard on http://localhost:3000
#   docker compose -f infra/docker-compose.yml --profile voice up   # also the voice service (needs OpenAI and Twilio)
# With ATTENDRA_DEMO_MODE=true in .env, the seed records a week of demo calls and adds
# the demo logins; their password is printed once (docker compose logs seed) unless
# ATTENDRA_DEMO_PASSWORD is set. Leave it false for anything that will hold real patient data.
# The voice service needs a public HTTPS URL for OpenAI's webhook (docs/live-call.md).
name: attendra

x-node: &node
  build: { context: .., dockerfile: infra/Dockerfile }
  env_file: ../.env
  environment:
    DATABASE_URL: postgres://attendra:attendra@postgres:5432/attendra

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attendra
      POSTGRES_PASSWORD: attendra
      POSTGRES_DB: attendra
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendra"]
      interval: 3s
      retries: 20

  migrate:
    <<: *node
    command: ["pnpm", "db:migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  seed:
    <<: *node
    # demo data (clinic, patients, recorded calls, logins) in demo mode; the clinic and patients only otherwise
    command: ["sh", "-c", "case \"$$ATTENDRA_DEMO_MODE\" in true|1) pnpm --filter @attendra/api demo:seed ;; *) pnpm db:seed ;; esac"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  api:
    <<: *node
    command: ["pnpm", "--filter", "@attendra/api", "start"]
    environment:
      DATABASE_URL: postgres://attendra:attendra@postgres:5432/attendra
      TRUST_PROXY: "true"
    depends_on: { seed: { condition: service_completed_successfully } }

  web:
    build: { context: .., dockerfile: infra/web.Dockerfile, args: { API_URL: "http://api:8081" } }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  voice:
    <<: *node
    profiles: [voice]
    command: ["pnpm", "--filter", "@attendra/voice", "start"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { seed: { condition: service_completed_successfully } }

volumes:
  pgdata:
