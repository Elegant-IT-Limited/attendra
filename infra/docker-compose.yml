# Local stack: Postgres, the migrations, the seed, the dashboard API, the worker and the dashboard.
#   cp .env.example .env   # set ATTENDRA_DATA_KEY and BETTER_AUTH_SECRET
#   docker compose -f infra/docker-compose.yml up              # dashboard on http://localhost:3000
#   docker compose -f infra/docker-compose.yml --profile voice up   # also the voice service (needs OPENAI_API_KEY)
# With ATTENDRA_DEMO_MODE=true in .env, the seed records a week of demo calls and adds
# the demo logins, with ATTENDRA_DEMO_PASSWORD as their password. Leave it false for anything that will hold real patient data.
# Test calls from the dashboard need the voice profile, VOICE_INTERNAL_TOKEN and
# VOICE_URL=http://voice:8080 (docs/test-calls.md). Phone calls also need a public
# HTTPS URL for OpenAI's webhook, and Twilio (docs/live-call.md).
name: attendra

x-node: &node
  build: { context: .., dockerfile: infra/Dockerfile }
  env_file: ../.env
  environment:
    DATABASE_URL: postgres://attendra:attendra@postgres:5432/attendra

services:
  postgres:
    # Postgres 16 with pgvector, for the clinic's knowledge (docs/self-hosting.md has the upgrade from postgres:16)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: attendra
      POSTGRES_PASSWORD: attendra
      POSTGRES_DB: attendra
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendra"]
      interval: 3s
      retries: 20

  migrate:
    <<: *node
    command: ["pnpm", "db:migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  seed:
    <<: *node
    # demo data (clinic, patients, recorded calls, logins) in demo mode; the clinic and patients only otherwise
    command: ["sh", "-c", "case \"$$ATTENDRA_DEMO_MODE\" in true|1) pnpm --filter @attendra/api demo:seed ;; *) pnpm db:seed ;; esac"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  api:
    <<: *node
    command: ["pnpm", "--filter", "@attendra/api", "start"]
    environment:
      DATABASE_URL: postgres://attendra:attendra@postgres:5432/attendra
      TRUST_PROXY: "true"
    depends_on: { seed: { condition: service_completed_successfully } }
    restart: unless-stopped

  # background jobs: call summaries, indexing the clinic's documents, webhook delivery and
  # the nightly retention purge. Without OPENAI_API_KEY it writes summaries from each call's
  # facts and embeds documents locally, with no model.
  worker:
    <<: *node
    command: ["pnpm", "--filter", "@attendra/worker", "start"]
    depends_on: { seed: { condition: service_completed_successfully } }
    restart: unless-stopped

  # MCP over Streamable HTTP for other AI agents (docs/mcp.md): docker compose --profile mcp up
  mcp:
    <<: *node
    profiles: [mcp]
    command: ["pnpm", "--filter", "@attendra/mcp", "start"]
    ports: ["127.0.0.1:8082:8082"]
    depends_on: { seed: { condition: service_completed_successfully } }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: infra/web.Dockerfile, args: { API_URL: "http://api:8081" } }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  voice:
    <<: *node
    profiles: [voice]
    command: ["pnpm", "--filter", "@attendra/voice", "start"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { seed: { condition: service_completed_successfully } }
    restart: unless-stopped

volumes:
  pgdata:
